name: toybox CI

on:
  schedule:
    - cron:  '0 2 * * *'
  push:
    branches: [ master, prompt-cult, agt-agent-sandbox ]
  pull_request:

jobs:
  MacOS:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: brew install gnu-sed
    - name: Configure
      run: make macos_defconfig
    - name: Build
      run: make
    - name: Test
      run: VERBOSE=all make tests

  Ubuntu:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y build-essential
    - name: Configure build and test
      run: VERBOSE=all CC=clang make defconfig tests

  Ubuntu-openssl-wget:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
    - name: Configure with OpenSSL-backed wget
      run: |
        make defconfig
        sed -i 's/# CONFIG_TOYBOX_LIBCRYPTO is not set/CONFIG_TOYBOX_LIBCRYPTO=y/' .config
        grep -q '^CONFIG_TOYBOX_LIBCRYPTO=y' .config
    - name: Build
      run: make -j"$(nproc)"
    - name: Test
      run: VERBOSE=all make tests
    - name: HTTPS smoke test
      run: |
        ./toybox wget -O /tmp/smoke.txt https://raw.githubusercontent.com/landley/toybox/master/README
        head -3 /tmp/smoke.txt
